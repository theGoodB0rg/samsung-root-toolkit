[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srtk"
version = "0.1.0"
description = "Remote Samsung (SM-A325F) bootloader unlock + Magisk root + Play Integrity toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SRTK Operators" }]
keywords = ["samsung", "magisk", "odin", "play-integrity", "adb", "root"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
srtk = "srtk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
